spring.application.name=ecoride-api-gateway
server.port=8080

# New Spring Boot 3.5+ Gateway Configuration (Webflux)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Route 0: User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ECORIDE-USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# Route 1: Driver Service
spring.cloud.gateway.server.webflux.routes[1].id=driver-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ECORIDE-DRIVER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/drivers/**

# Route 2: Ride Service
spring.cloud.gateway.server.webflux.routes[2].id=ride-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ECORIDE-RIDE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/rides/**

# Route 3: Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ECORIDE-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/**
